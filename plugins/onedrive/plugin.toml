[plugin]
id = "onedrive"
name = "OneDrive"
version = "0.1.10"
type = "remote-rust"
description = "OneDrive remote filesystem plugin for kkc-rust using Microsoft Graph"

[remote]
library = "target/release/libkkc_remote_onedrive.dylib"

[extra]
api = "kkc-plugin-api/0.1"
build = "env CARGO_TARGET_DIR=target cargo build --release"
