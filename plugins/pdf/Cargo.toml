[package]
name = "kkc-viewer-pdf"
version = "0.1.0"
edition = "2024"
description = "PDF viewer plugin for kkc-rust"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
abi_stable     = "0.11.3"
base64         = "0.22"
mupdf          = { version = "0.6.0", default-features = false }
flume          = { version = "0.12", default-features = false, features = ["select"] }
wide           = "0.7"
lru            = "0.12"
rayon          = { version = "1.11", default-features = false }
once_cell      = "1"
kkc-plugin-api = { path = "../../../kkc-rust/crates/kkc-plugin-api" }
serde_json     = "1"
unicode-width  = "0.2"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"
