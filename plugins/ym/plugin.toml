[plugin]
id = "ym"
name = "YM Decoder"
version = "0.1.0"
type = "audio-rust"
description = "YM5/YM6 decoder plugin streaming PCM and playback metadata to kkc-rust"

[audio]
library = "target/release/libkkc_audio_ym.dylib"

[extra]
api = "kkc-plugin-api/0.1"
build = "env CARGO_TARGET_DIR=target cargo build --release"
