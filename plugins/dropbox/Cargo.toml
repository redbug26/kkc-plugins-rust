[package]
name = "kkc-remote-dropbox"
version = "0.1.1"
edition = "2024"
description = "Dropbox remote plugin for kkc-rust"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11.3"
kkc-plugin-api = { path = "../../../kkc-rust/crates/kkc-plugin-api" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "native-tls"] }
