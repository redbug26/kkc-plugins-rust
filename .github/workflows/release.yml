name: Release Plugins

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Dropbox plugin
        run: cargo build --release -p kkc-remote-dropbox

      - name: Package Dropbox plugin
        run: |
          mkdir -p dist/dropbox/target/release
          cp plugins/dropbox/plugin.toml dist/dropbox/plugin.toml
          cp target/release/libkkc_remote_dropbox.so dist/dropbox/target/release/
          (cd dist/dropbox && zip -r ../../dropbox-linux-x86_64.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: dropbox-linux-x86_64
          path: dropbox-linux-x86_64.zip

  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Dropbox plugin
        run: cargo build --release -p kkc-remote-dropbox

      - name: Package Dropbox plugin
        run: |
          mkdir -p dist/dropbox/target/release
          cp plugins/dropbox/plugin.toml dist/dropbox/plugin.toml
          cp target/release/libkkc_remote_dropbox.dylib dist/dropbox/target/release/
          (cd dist/dropbox && zip -r ../../dropbox-macos-arm64.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: dropbox-macos-arm64
          path: dropbox-macos-arm64.zip

  release:
    name: Publish release
    needs: [build-linux, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten artifacts
        run: find artifacts/ -name '*.zip' -exec mv {} . \;

      - name: Resolve tag
        id: version
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dropbox-linux-x86_64.zip
            dropbox-macos-arm64.zip
