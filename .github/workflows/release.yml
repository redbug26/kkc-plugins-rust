name: Release Plugins

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

env:
  CARGO_TERM_COLOR: always

jobs:
  discover-plugins:
    name: Discover plugins
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.discover.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4

      - name: Build dynamic plugin matrix
        id: discover
        run: |
          plugins_json="$(python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          plugins = []
          plugins_root = Path("plugins")
          if not plugins_root.exists():
            raise SystemExit("plugins/ directory not found")

          for plugin_dir in sorted(plugins_root.iterdir()):
            if not plugin_dir.is_dir():
              continue

            cargo_toml = plugin_dir / "Cargo.toml"
            plugin_toml = plugin_dir / "plugin.toml"
            if not cargo_toml.exists() or not plugin_toml.exists():
              continue

            cargo_data = tomllib.loads(cargo_toml.read_text(encoding="utf-8"))
            crate_name = cargo_data.get("package", {}).get("name")
            if not crate_name:
              raise SystemExit(f"Missing package.name in {cargo_toml}")

            plugins.append(
              {
                "plugin_id": plugin_dir.name,
                "crate_name": crate_name,
                "lib_name": f"lib{crate_name.replace('-', '_')}",
              }
            )

          if not plugins:
            raise SystemExit("No releasable plugins found under plugins/")

          print(json.dumps(plugins))
          PY
          )"

          echo "Detected plugins: ${plugins_json}"
          echo "plugins=${plugins_json}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.plugin.plugin_id }} on ${{ matrix.target.platform }}
    needs: [discover-plugins]
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-latest
            platform: linux-x86_64
            lib_ext: so
          - os: macos-latest
            platform: macos-arm64
            lib_ext: dylib
        plugin: ${{ fromJson(needs.discover-plugins.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build plugin
        run: cargo build --release -p ${{ matrix.plugin.crate_name }}

      - name: Package plugin
        run: |
          mkdir -p dist/${{ matrix.plugin.plugin_id }}/target/release
          cp plugins/${{ matrix.plugin.plugin_id }}/plugin.toml dist/${{ matrix.plugin.plugin_id }}/plugin.toml
          cp target/release/${{ matrix.plugin.lib_name }}.${{ matrix.target.lib_ext }} dist/${{ matrix.plugin.plugin_id }}/target/release/
          (cd dist/${{ matrix.plugin.plugin_id }} && zip -r ../../${{ matrix.plugin.plugin_id }}-${{ matrix.target.platform }}.zip .)

      - name: Validate packaged plugin identity
        run: |
          python3 - <<'PY'
          import subprocess
          import tomllib
          import zipfile
          from pathlib import Path

          expected_id = "${{ matrix.plugin.plugin_id }}"
          archive = Path(f"{expected_id}-${{ matrix.target.platform }}.zip")
          if not archive.is_file():
            raise SystemExit(f"Missing package archive: {archive}")

          with zipfile.ZipFile(archive) as zf:
            names = set(zf.namelist())
            if "plugin.toml" not in names:
              raise SystemExit(f"{archive}: plugin.toml missing")
            manifest = tomllib.loads(zf.read("plugin.toml").decode("utf-8"))
            manifest_id = manifest.get("plugin", {}).get("id", "")
            if manifest_id != expected_id:
              raise SystemExit(
                f"{archive}: plugin.id='{manifest_id}' does not match expected '{expected_id}'"
              )

          lib_path = Path(
            f"target/release/${{ matrix.plugin.lib_name }}.${{ matrix.target.lib_ext }}"
          )
          if not lib_path.is_file():
            raise SystemExit(f"Built library missing: {lib_path}")

          strings = subprocess.check_output(["strings", str(lib_path)], text=True, errors="ignore")
          if expected_id not in strings:
            raise SystemExit(
              f"{lib_path}: expected plugin id '{expected_id}' not found in binary strings"
            )
          print(f"Validated plugin packaging identity for {expected_id}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin.plugin_id }}-${{ matrix.target.platform }}
          path: ${{ matrix.plugin.plugin_id }}-${{ matrix.target.platform }}.zip

  release:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten artifacts
        run: find artifacts/ -name '*.zip' -exec mv {} . \;

      - name: Resolve tag
        id: version
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: '*.zip'
